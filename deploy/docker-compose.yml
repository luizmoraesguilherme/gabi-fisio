padding: 2rem var(--gutter) 4rem; display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 2.5rem; align-items: start; }\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.6rem; }\n.chip { font: 700 1rem/1 var(--f-texto); padding: .75rem 1.1rem; min-height: 2.75rem; border-radius: 999px; border: 2px solid var(--linha); background: #fff; color: var(--tinta); cursor: pointer; }\n.chip:hover { border-color: #AEBCC8; }\n.chip[aria-pressed=\"true\"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }\n.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 2rem 1.6rem; }\n.prod { display: grid; grid-template-rows: auto auto 1fr auto; gap: .5rem; align-content: start; }\n.prod-img { aspect-ratio: 1 / 1; display: grid; place-items: center; border-radius: var(--raio-m); background: var(--areia); overflow: hidden; }\n.prod-img svg { width: 55%; }\n.prod-img img { width: 100%; height: 100%; object-fit: cover; }\n.prod-img.cat-oleos { background: #E8F0F8; }\n.prod-img.cat-fitas { background: #F6E9EE; }\n.prod h3 { font-size: 1.2rem; font-weight: 700; margin-top: .4rem; }\n.prod-desc { color: var(--tinta-suave); font-size: 1rem; }\n.prod-foot { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-top: .3rem; }\n.prod-price { font: 800 1.35rem/1 var(--f-display); }\n.prod-low { color: #A23A5B; font-size: .95rem; }\n.btn[disabled] { opacity: .55; cursor: not-allowed; }\n.bag { position: sticky; top: 1rem; background: #fff; border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 1.3rem; display: grid; gap: 1rem; }\n.bag h2 { font-size: 1.35rem; }\n.bag-empty { color: var(--tinta-suave); }\n.bag-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }\n.bag-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem .8rem; padding-bottom: .9rem; border-bottom: 1px solid var(--linha); }\n.bag-list small { display: block; color: var(--tinta-suave); }\n.line-total { grid-column: 2; justify-self: end; }\n.qty { display: inline-flex; align-items: center; gap: .3rem; }\n.qty button { width: 2.5rem; height: 2.5rem; border-radius: var(--raio-s); border: 2px solid var(--linha); background: #fff; font: 700 1.2rem/1 var(--f-texto); cursor: pointer; color: var(--tinta); }\n.qty button:hover:not(:disabled) { border-color: var(--fita-azul); }\n.qty button:disabled { opacity: .4; cursor: not-allowed; }\n.qty b { min-width: 1.6rem; text-align: center; }\n.bag-total { display: flex; justify-content: space-between; font-size: 1.2rem; }\n.bag-total b { font: 800 1.5rem/1 var(--f-display); }\n.order-form { display: grid; gap: 1rem; padding-top: .4rem; }\n.deliv { display: grid; gap: .5rem; }\n.deliv legend { font-weight: 700; font-size: 1rem; font-family: var(--f-texto); margin-bottom: .4rem; }\n.bag-note { color: var(--tinta-suave); font-size: .95rem; }\n.order-form .btn { width: 100%; }\n@media (max-width: 960px) {\n  .loja-layout { grid-template-columns: 1fr; }\n  .bag { position: static; }\n}\n@media (max-width: 560px) {\n  .top nav a:not(.nav-cta):not([aria-current]):not(.bag-link):not([href=\"loja.html\"]) { display: none; }\n  .top nav { gap: .9rem; }\n}\n\n/* ---------- Painel: preços, loja ---------- */\n.tbl-precos th:not(:first-child), .tbl-precos td:not(:first-child) { width: 13rem; }\n.tbl-precos .grp th { padding-top: 1.6rem; font: 700 1.2rem var(--f-display); color: var(--tinta); border-bottom: 3px solid var(--fita-azul); }\n.tbl-precos .grp:nth-of-type(n+2) th { border-bottom-color: var(--fita-rosa); }\n.money { display: flex; align-items: center; gap: .4rem; }\n.money span { color: var(--tinta-suave); }\n.money input { min-height: 2.8rem; padding: .5rem .7rem; }\n.subviews { display: flex; gap: 1.4rem; margin-top: 1rem; border-bottom: 1px solid var(--linha); }\n.subviews button { background: none; border: 0; border-bottom: 3px solid transparent; padding: .7rem 0; font: 700 1.05rem/1 var(--f-texto); color: var(--tinta-suave); cursor: pointer; }\n.subviews button[aria-current=\"page\"] { color: var(--tinta); border-bottom-color: var(--fita-rosa); }\n.order { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 1.2rem 1.4rem; margin-top: 1.2rem; display: grid; gap: .8rem; }\n.order h3 { font-size: 1.25rem; }\n.order.status-cancelado { opacity: .65; }\n.order-items { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }\n.order-items li { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-bottom: 1px dotted var(--linha); }\n.order-total { display: flex; justify-content: space-between; font-size: 1.1rem; max-width: 24rem; }\n.tag-o-novo { border-color: var(--fita-rosa); color: #A23A5B; }\n.tag-o-pago, .tag-o-entregue, .tag-o-confirmado { border-color: var(--ok); color: var(--ok); }\n.novo-prod { margin: 1.2rem 0 .4rem; }\n.novo-prod summary { display: inline-flex; list-style: none; cursor: pointer; }\n.novo-prod summary::-webkit-details-marker { display: none; }\n.prod-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin-top: 1rem; padding: 1.2rem; background: var(--nevoa); border-radius: var(--raio-m); align-items: end; }\n.prod-wide { grid-column: 1 / -1; }\n.prod-admin { display: grid; }\n.pa { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1.4rem; padding: 1.4rem 0; border-bottom: 1px solid var(--linha); }\n.pa.is-off { opacity: .7; }\n.pa-img { display: grid; gap: .3rem; align-content: start; justify-items: start; }\n.pa-img > img, .pa-img > span { width: 9rem; height: 9rem; border-radius: var(--raio-m); object-fit: cover; background: var(--areia); display: grid; place-items: center; color: var(--tinta-suave); font-size: .95rem; }\n.pa-img label { cursor: pointer; }\n.pa-main { display: grid; gap: .8rem; }\n.pa-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 1rem; }\n@media (max-width: 700px) { .pa { grid-template-columns: 1fr; } }\n"

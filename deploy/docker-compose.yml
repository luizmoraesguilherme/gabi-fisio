-bottom: .9rem; padding: 0; }\n.field { display: grid; gap: .4rem; }\n.field > span { font-weight: 700; }\n.field i { font-style: normal; font-weight: 400; color: var(--tinta-suave); }\ninput, select, textarea {\n  font: 400 1.1rem/1.4 var(--f-texto); color: var(--tinta); background: #fff;\n  border: 2px solid var(--linha); border-radius: var(--raio-s); padding: .75rem .85rem; min-height: 3.2rem; width: 100%;\n}\ntextarea { resize: vertical; min-height: 6rem; }\ninput:hover, select:hover, textarea:hover { border-color: #AEBCC8; }\ninput:focus, select:focus, textarea:focus { border-color: var(--fita-azul); outline: none; box-shadow: 0 0 0 3px rgba(42, 120, 194, .2); }\n[aria-invalid=\"true\"] { border-color: var(--erro); }\n.error { color: var(--erro); font-style: normal; font-size: 1rem; min-height: 0; }\n.error:empty { display: none; }\n.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }\n.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }\n\n.day-picker { display: flex; gap: .5rem; overflow-x: auto; padding: .2rem .2rem .6rem; scrollbar-width: thin; }\n.day-picker button {\n  flex: none; display: grid; justify-items: center; gap: .1rem; min-width: 4.6rem; padding: .6rem .5rem;\n  border: 2px solid var(--linha); border-radius: var(--raio-s); background: #fff; color: var(--tinta); cursor: pointer;\n  font: 400 .95rem/1.2 var(--f-texto);\n}\n.day-picker button b { font: 800 1.6rem/1 var(--f-display); }\n.day-picker button:hover { border-color: var(--fita-azul); }\n.day-picker button[aria-checked=\"true\"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }\n.time-picker { display: flex; flex-wrap: wrap; gap: .5rem; }\n.time-picker button {\n  min-width: 5.2rem; min-height: 3rem; border: 2px solid var(--linha); border-radius: var(--raio-s);\n  background: #fff; color: var(--tinta); font: 700 1.1rem/1 var(--f-texto); cursor: pointer;\n}\n.time-picker button:hover { border-color: var(--fita-azul); }\n.time-picker button[aria-checked=\"true\"] { background: var(--fita-azul); border-color: var(--fita-azul); color: #fff; }\n.picked { color: var(--tinta-suave); }\n.picked strong { color: var(--tinta); }\n\n.form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.4rem; }\n.form-status { color: var(--erro); }\n\n.done { max-width: 40rem; border-left: 6px solid var(--ok); padding: 1.2rem 0 1.2rem 1.5rem; display: grid; gap: .8rem; justify-items: start; }\n.done h3 { font-size: var(--t-2); }\n.done:focus { outline: none; }\n\n/* ---------- Rodapé ---------- */\n.foot {\n  max-width: var(--max); margin: 0 auto; padding: 2.5rem var(--gutter) 3rem; border-top: 1px solid var(--linha);\n  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; color: var(--tinta-suave); font-size: 1rem;\n}\n.foot-links { display: flex; gap: 1.2rem; }\n\n/* ---------- Responsivo ---------- */\n@media (max-width: 860px) {\n  .hero { grid-template-columns: 1fr; }\n  .agenda { transform: none; margin-top: 1rem; }\n  .services { grid-template-columns: 1fr; }\n  .steps { grid-template-columns: 1fr; }\n}\n@media (max-width: 560px) {\n  :root { --t-3: 2.1rem; }\n  .top nav a:not(.nav-cta) { display: none; }\n  .grid-2 { grid-template-columns: 1fr; }\n  .btn { width: 100%; }\n  .hero-actions .btn, .form-actions .btn { width: 100%; }\n}\n\n/* ---------- Painel ---------- */\n.link-btn { background: none; border: 0; padding: .3rem 0; font: 700 1.05rem/1.2 var(--f-texto); color: var(--fita-azul-escura); text-decoration: underline; text-underline-offset: .18em; cursor: pointer; }\n.link-btn:hover { color: var(--tinta); }\n.panel-main { max-width: var(--max); margin: 0 auto; padding: 1rem var(--gutter) 4rem; }\n.login { max-width: 28rem; padding-top: 3rem; display: grid; gap: 1.6rem; }\n.login h1, .panel-head h1 { font-size: var(--t-3); font-weight: 800; letter-spacing: -0.025em; }\n.panel-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem 2rem; padding: 1.5rem 0 1rem; border-bottom: 1px solid var(--linha); }\n.tabs { display: flex; flex-wrap: wrap; gap: .4rem; }\n.tabs button { font: 700 1rem/1 var(--f-texto); padding: .7rem 1rem; min-height: 2.75rem; border-radius: var(--raio-s); border: 2px solid var(--linha); background: #fff; color: var(--tinta); cursor: pointer; }\n.tabs button[aria-selected=\"true\"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }\n.count { font-weight: 400; }\n.empty { color: var(--tinta-suave); padding: 2rem 0; }\n.day-group { margin-top: 2.2rem; }\n.day-group > h2 { font-size: var(--t-1); font-weight: 700; padding-bottom: .5rem; border-bottom: 3px solid var(--fita-azul); }\n.booking-row { display: grid; grid-template-columns: 5rem minmax(0, 1fr) auto; gap: 1rem 1.5rem; padding: 1.3rem 0; border-bottom: 1px solid var(--linha); }\n.b-time { font: 800 1.6rem/1 var(--f-display); color: var(--fita-azul-escura); padding-top: .15rem; }\n.b-main { display: grid; gap: .25rem; }\n.b-main h3 { font-size: 1.3rem; font-weight: 700; }\n.b-main h3 span { font: 400 1rem var(--f-texto); color: var(--tinta-suave); }\n.b-svc { font-weight: 700; }\n.b-notes { background: var(--nevoa); border-radius: var(--raio-s); padding: .6rem .8rem; margin-top: .3rem; max-width: 60ch; }\n.tag { font-weight: 400; font-size: .9rem; border: 1px solid var(--linha); border-radius: 999px; padding: .1rem .55rem; margin-left: .4rem; color: var(--tinta-suave); white-space: nowrap; }\n.status-confirmado .tag { border-color: var(--ok); color: var(--ok); }\n.status-recusado, .status-cancelado { opacity: .6; }\n.b-actions { display: grid; gap: .5rem; align-content: start; justify-items: stretch; min-width: 13rem; }\n.b-actions .link-btn { justify-self: start; }\n.blocks { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--linha); display: grid; gap: 1rem; max-width: 46rem; }\n.blocks h2 { font-size: var(--t-2); font-weight: 800; }\n.blocks > p { color: var(--tinta-suave); }\n.block-form { display: grid; grid-template-columns: 12rem 1fr auto; gap: 1rem; align-items: end; }\n.block-list { list-style: none; margin: 0; padding: 0; }\n.block-list li { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-bottom: 1px solid var(--linha); }\n@media (max-width: 760px) {\n  .booking-row { grid-template-columns: 4rem minmax(0, 1fr); }\n  .b-actions { grid-column: 1 / -1; min-width: 0; }\n  .block-form { grid-template-columns: 1fr; }\n}\n\n/* ---------- Planos e sessões escolhidas ---------- */\n.plans { display: grid; gap: .5rem; }\n.plan { display: flex; gap: .85rem; align-items: center; padding: .85rem 1rem; border: 2px solid var(--linha); border-radius: var(--raio-s); background: #fff; cursor: pointer; }\n.plan:hover { border-color: #AEBCC8; }\n.plan input { width: 1.3rem; height: 1.3rem; min-height: 0; margin: 0; accent-color: var(--fita-azul); flex: none; }\n.plan strong { display: block; }\n.plan small { display: block; color: var(--tinta-suave); font-size: 1rem; }\n.plan:has(input:checked) { border-color: var(--fita-azul); box-shadow: inset 4px 0 0 var(--fita-azul); }\n.plan-rule { background: var(--nevoa); border-radius: var(--raio-s); padding: .8rem 1rem; max-width: 60ch; }\n.day-picker button[disabled] { opacity: .35; cursor: not-allowed; border-color: var(--linha); }\n.day-picker button.has-pick { box-shadow: inset 0 -5px 0 var(--fita-rosa); }\n.chosen { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }\n.chosen li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .55rem .8rem; background: #fff; border: 1px solid var(--linha); border-left: 4px solid var(--fita-rosa); border-radius: var(--raio-s); }\n.chosen:empty { display: none; }\n\n/* ---------- Painel: seções ---------- */\n.views { display: flex; gap: 1.6rem; border-bottom: 1px solid var(--linha); margin-top: .5rem; overflow-x: auto; }\n.views button { background: none; border: 0; border-bottom: 4px solid transparent; padding: .8rem 0 .7rem; font: 700 1.15rem/1 var(--f-display); color: var(--tinta-suave); cursor: pointer; white-space: nowrap; }\n.views button:hover { color: var(--tinta); }\n.views button[aria-current=\"page\"] { color: var(--tinta); border-bottom-color: var(--fita-azul); }\n.tag-pacote { border-color: var(--fita-rosa); color: #A23A5B; }\n.b-time-pkg { display: grid; justify-items: start; }\n.b-time-pkg small { font: 400 .9rem var(--f-texto); color: var(--tinta-suave); margin-top: .2rem; }\n.pkg-sessions { margin: .3rem 0 0; padding-left: 1.1rem; }\n.b-hint { color: var(--tinta-suave); font-size: 1rem; }\n.link-danger { color: var(--erro); }\n\n/* Calendário */\n.cal-nav { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }\n.cal-nav h2 { font-size: var(--t-1); min-width: 11ch; text-align: center; }\n.cal-nav .btn { min-height: 2.6rem; padding: .4rem .9rem; font-size: 1rem; }\n.cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.2rem; margin: 1.2rem 0 .8rem; color: var(--tinta-suave); font-size: 1rem; }\n.key { display: inline-block; width: 1rem; height: 1rem; border-radius: 3px; margin-right: -.8rem; vertical-align: -2px; }\n.key-avulso { background: var(--nevoa); border-left: 4px solid var(--fita-azul); }\n.key-pacote { background: var(--nevoa); border-left: 4px solid var(--fita-rosa); }\n.key-feito { background: #fff; border: 1px dashed #9FB0BF; }\n.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--linha); border-left: 1px solid var(--linha); }\n.cal-wd { padding: .5rem .6rem; font-size: .95rem; font-weight: 700; color: var(--tinta-suave); border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); background: var(--papel); }\n.cal-cell { min-height: 7.5rem; padding: .4rem; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); background: #fff; display: flex; flex-direction: column; gap: .25rem; }\n.cal-pad { background: var(--papel); }\n.cal-cell.is-past { background: #FBFCFC; }\n.cal-day b { font: 700 1rem/1 var(--f-display); display: inline-grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 50%; }\n.cal-cell.is-today .cal-day b { background: var(--tinta); color: #fff; }\n.cal-day-long { display: none; }\n.cal-item { text-align: left; border: 0; border-left: 4px solid var(--fita-azul); background: var(--nevoa); border-radius: 4px; padding: .3rem .4rem; font: 400 .95rem/1.2 var(--f-texto); color: var(--tinta); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.cal-item:hover { background: #E1EAF1; }\n.cal-item.is-pkg { border-left-color: var(--fita-rosa); }\n.cal-item.is-done { background: #fff; outline: 1px dashed #9FB0BF; outline-offset: -1px; color: var(--tinta-suave); }\n.cal-time { font-weight: 700; }\n.cal-empty { grid-column: 1 / -1; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); padding: 1.2rem; margin: 0; }\n.cal-detail { margin-top: 1.6rem; }\n.cal-detail > h2 { font-size: var(--t-1); padding-bottom: .5rem; border-bottom: 3px solid var(--fita-azul); }\n.cal-detail:focus { outline: none; }\n\n/* Pacotes */\n.pac-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin: 1.6rem 0 1rem; }\n.pac-summary > div { border-left: 4px solid var(--linha); padding: .2rem 0 .2rem 1rem; }\n.pac-summary > div:nth-child(2) { border-left-color: var(--fita-azul); }\n.pac-summary > div:nth-child(3) { border-left-color: var(--fita-rosa); }\n.pac-summary dt { color: var(--tinta-suave); font-size: 1rem; }\n.pac-summary dd { margin: .15rem 0 0; font: 800 2rem/1.1 var(--f-display); }\n.pac-summary p { font-size: .95rem; color: var(--tinta-suave); margin-top: .2rem; }\n.pac-list { display: grid; gap: 1.2rem; margin-top: 1rem; }\n.pkg { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 1.3rem 1.4rem; display: grid; gap: 1rem; }\n.pkg.is-urgent { border-color: var(--fita-rosa); box-shadow: inset 5px 0 0 var(--fita-rosa); }\n.pkg-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; align-items: start; }\n.pkg-head h3 { font-size: 1.35rem; }\n.pkg-head p { color: var(--tinta-suave); margin-top: .2rem; }\n.pkg-pay { display: flex; align-items: end; gap: .8rem; flex-wrap: wrap; }\n.pkg-price { width: 8.5rem; }\n.pkg-price > span { font-size: .95rem; }\n.pkg-price input { min-height: 2.8rem; padding: .5rem .7rem; }\n.pkg-pay .btn { min-height: 2.8rem; }\n.paid { color: var(--ok); font-weight: 700; padding-bottom: .5rem; }\n.meter { display: grid; gap: .35rem; }\n.meter-top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 1rem; }\n.meter-top span:first-child { font-weight: 700; }\n.meter-top span:last-child { color: var(--tinta-suave); }\n.meter-track { height: .75rem; background: var(--nevoa); border-radius: 999px; overflow: hidden; }\n.meter-fill { height: 100%; background: var(--fita-azul); border-radius: inherit; }\n.meter-time .meter-fill { background: #8FA3B5; }\n.meter-time.is-urgent .meter-fill { background: var(--fita-rosa); }\n.pkg-dots { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }\n.pkg-dots li { font-size: .95rem; padding: .3rem .6rem; border-radius: var(--raio-s); background: var(--nevoa); }\n.pkg-dots li span { color: var(--tinta-suave); }\n.pkg-dots .dot-concluido { background: #E3F1EA; }\n.pkg-dots .dot-concluido span { color: var(--ok); }\n.pkg-dots .dot-cancelado, .pkg-dots .dot-recusado { text-decoration: line-through; opacity: .65; }\n.pkg-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.4rem; }\n\n@media (max-width: 760px) {\n  .cal-grid { display: block; border: 0; }\n  .cal-wd, .cal-pad, .cal-cell:not(.has-items) { display: none; }\n  .cal-cell { min-height: 0; border: 0; border-bottom: 1px solid var(--linha); padding: .8rem 0; background: none; }\n  .cal-cell.is-past { background: none; }\n  .cal-day b { display: none; }\n  .cal-day-long { display: block; font-weight: 700; margin-bottom: .2rem; }\n  .cal-cell.is-today .cal-day-long::after { content: \" (hoje)\"; color: var(--fita-azul-escura); }\n  .cal-item { white-space: normal; font-size: 1.05rem; padding: .55rem .7rem; }\n  .cal-empty { border: 0; padding: 1rem 0; }\n  .pac-summary { grid-template-columns: 1fr; }\n  .cal-nav h2 { min-width: 0; }\n}\n"
